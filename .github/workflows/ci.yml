name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tools are copied onto servers and run with the system python3,
        # so test an older interpreter as well as a current one.
        # Python 3.9 is not available on ubuntu-latest (26.04), so it runs on 24.04.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-socket pytest-cov

      - name: Run unit tests (network disabled) with coverage
        run: >-
          python -m pytest -q --disable-socket
          --cov=tools --cov-report=term-missing

      - name: Add coverage table to job summary
        if: always() && hashFiles('.coverage') != ''
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  live-qdrant:
    name: live (Qdrant ${{ matrix.qdrant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qdrant: ["v1.19", "v1.20"]

    services:
      qdrant:
        image: qdrant/qdrant:${{ matrix.qdrant }}
        ports:
          - 6333:6333

    env:
      QDRANT_URL: http://localhost:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Wait for Qdrant to be ready
        run: |
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://localhost:6333/readyz", timeout=2)
                  print("Qdrant is ready")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Qdrant did not become ready in 60 s")
          PY

      - name: Run the tools against live Qdrant
        shell: bash
        run: |
          python -m pytest -q -rs tests/test_live_qdrant.py | tee pytest.out
          # Fail if the live test was skipped instead of run.
          if grep -q skipped pytest.out; then echo "::error::live Qdrant test was skipped"; exit 1; fi
